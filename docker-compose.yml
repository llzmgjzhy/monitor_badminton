services:

  monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile.monitor
    container_name: wxbot-monitor
    restart: always
    env_file:
      - ./.env
    environment:
      - PYTHONUNBUFFERED=1
      - HEADLESS=true
      - DATA_DIR=/data
    volumes:
      - ./app:/app
      - ./scripts:/scripts
      - ./data:/data
    working_dir: /app
